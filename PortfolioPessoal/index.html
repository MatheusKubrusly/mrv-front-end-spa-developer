<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfólio pessoal - desenvolvedor web fullstack">
  <meta name="author" content="Matheus Kubrusly">
  <title>Portfólio Pessoal - Matheus Kubrusly</title>
  
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <!-- Header: será preenchido pela Issue #4 -->
  <header class="header">
    <!-- Logo, Navegação e Toggles de tema/idioma -->
    <nav class="header-nav">
      <a href="#home" class="nav-link" data-i18n="nav.home">Home</a>
      <a href="#news" class="nav-link" data-i18n="nav.news">Notícias</a>
      <a href="#cv" class="nav-link" data-i18n="nav.cv">Currículo</a>
      <a href="#projects" class="nav-link" data-i18n="nav.projects">Projetos</a>
    </nav>
    <button id="language-toggle" class="language-toggle" title="Toggle Language / Alternar Idioma">
      <span id="lang-indicator">PT</span>
    </button>
  </header>

  <!-- Conteúdo Principal -->
  <main>
    <!-- Seção Hero -->
    <section id="hero" class="hero">
      <h1 data-i18n="hero.welcome">Bem-vindo</h1>
      <p data-i18n="hero.description">Desenvolvedor web fullstack apaixonado por tecnologia</p>
    </section>

    <!-- Seção Now (O que estou fazendo agora) -->
    <section id="now" class="now">
      <h2 data-i18n="now.title">O que estou fazendo agora</h2>
      <article>
        <!-- Conteúdo alimentado dinamicamente -->
      </article>
    </section>

    <!-- Seção Timeline (News/Posts) -->
    <section id="timeline" class="timeline">
      <h2 data-i18n="timeline.title">Timeline / Notícias</h2>
      <div class="posts-container">
        <!-- Posts carregados de data/news.json -->
      </div>
    </section>

    <!-- Seção Currículo -->
    <section id="curriculum" class="curriculum">
      <h2 data-i18n="curriculum.title">Currículo</h2>
      <div class="cv-container">
        <!-- Educação, Experiência e Hobbies carregados de data/curriculum.json -->
      </div>
    </section>

    <!-- Seção Projetos -->
    <section id="projects" class="projects">
      <h2 data-i18n="projects.title">Projetos</h2>
      <div class="projects-grid">
        <!-- Projetos carregados de data/projects.json -->
      </div>
    </section>
  </main>

  <!-- Rodapé -->
  <footer class="footer">
    <p data-i18n="footer.copyright">&copy; 2024 Portfólio Pessoal. Todos os direitos reservados.</p>
    <nav class="social-links">
      <!-- Links sociais -->
    </nav>
  </footer>

  <script src="scripts/utils/i18n.js"></script>
  <script src="scripts/main.js"></script>
</body>
</html>
